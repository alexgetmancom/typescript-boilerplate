name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Verify migrations
        run: bun run db:generate && git diff --exit-code -- drizzle

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: typescript-boilerplate:test

      - name: Smoke-test container
        run: |
          set -euo pipefail
          container_name=typescript-boilerplate-smoke
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach --name "$container_name" --publish 18080:8080 typescript-boilerplate:test

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_name"
          exit 1
